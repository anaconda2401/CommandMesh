[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "commandmesh"
version = "0.1.0"
description = "CommandMesh: Lightweight, peer-to-peer encrypted IoT device control mesh and LLM agent tool suite"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "paho-mqtt>=2.0.0",
    "PyNaCl>=1.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
desktop = [
    "pyautogui>=0.9.54",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]
all = [
    "commandmesh[desktop,dev]",
]

[tool.setuptools]
packages = ["tool", "lib", "config", "nodes"]

[tool.pytest.ini_options]
pythonpath = ["."]
